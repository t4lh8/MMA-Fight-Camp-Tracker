# Local demo: PostgreSQL + the app with fake demo data.
# JWT_SECRET and DB_PASSWORD come from your shell or a .env file (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fightcamp
      POSTGRES_USER: fightcamp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fightcamp"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fightcamp
      DB_USER: fightcamp
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
