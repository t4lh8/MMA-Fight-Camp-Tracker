<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#85837b"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#121211"/>

  <!-- Browser -->
  <rect x="30" y="170" width="170" height="120" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="115" y="200" text-anchor="middle" fill="#ecebe6" font-size="15" font-weight="700">Browser</text>
  <text x="115" y="224" text-anchor="middle" fill="#b4b2aa" font-size="12">Vanilla JS + SVG charts</text>
  <text x="115" y="244" text-anchor="middle" fill="#b4b2aa" font-size="12">Strict CSP, no inline JS</text>
  <text x="115" y="264" text-anchor="middle" fill="#b4b2aa" font-size="12">JWT in sessionStorage</text>

  <line x1="200" y1="230" x2="268" y2="230" stroke="#85837b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="234" y="220" text-anchor="middle" fill="#85837b" font-size="11">HTTPS</text>

  <!-- Cloud Run box -->
  <rect x="270" y="40" width="420" height="390" rx="12" fill="none" stroke="#3987e5" stroke-dasharray="6 5"/>
  <text x="290" y="66" fill="#3987e5" font-size="13" font-weight="700">Cloud Run service (one container + sidecar)</text>

  <rect x="295" y="85" width="370" height="250" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="480" y="112" text-anchor="middle" fill="#ecebe6" font-size="15" font-weight="700">Spring Boot 3 (Java 21)</text>

  <rect x="315" y="128" width="330" height="56" rx="8" fill="#232321"/>
  <text x="480" y="151" text-anchor="middle" fill="#ecebe6" font-size="13" font-weight="600">Spring Security filter chain</text>
  <text x="480" y="171" text-anchor="middle" fill="#b4b2aa" font-size="11">HS256 JWT check · roles · login lockout · security headers</text>

  <rect x="315" y="194" width="330" height="56" rx="8" fill="#232321"/>
  <text x="480" y="217" text-anchor="middle" fill="#ecebe6" font-size="13" font-weight="600">REST controllers + Bean Validation</text>
  <text x="480" y="237" text-anchor="middle" fill="#b4b2aa" font-size="11">owner id from token only · same 404 for foreign ids</text>

  <rect x="315" y="260" width="330" height="56" rx="8" fill="#232321"/>
  <text x="480" y="283" text-anchor="middle" fill="#ecebe6" font-size="13" font-weight="600">JdbcClient, hand-written SQL</text>
  <text x="480" y="303" text-anchor="middle" fill="#b4b2aa" font-size="11">named parameters · FILTER aggregates · weekly_load view</text>

  <rect x="295" y="355" width="370" height="54" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="480" y="378" text-anchor="middle" fill="#ecebe6" font-size="13" font-weight="600">Cloud SQL Auth Proxy (sidecar)</text>
  <text x="480" y="396" text-anchor="middle" fill="#b4b2aa" font-size="11">127.0.0.1:5432 · IAM auth · TLS · private IP</text>
  <line x1="480" y1="316" x2="480" y2="353" stroke="#85837b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cloud SQL -->
  <rect x="740" y="330" width="190" height="100" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="835" y="360" text-anchor="middle" fill="#ecebe6" font-size="15" font-weight="700">Cloud SQL</text>
  <text x="835" y="382" text-anchor="middle" fill="#b4b2aa" font-size="12">PostgreSQL 16</text>
  <text x="835" y="401" text-anchor="middle" fill="#b4b2aa" font-size="12">No public IP · pgaudit</text>
  <text x="835" y="420" text-anchor="middle" fill="#b4b2aa" font-size="12">Flyway migrations</text>
  <line x1="665" y1="382" x2="738" y2="382" stroke="#85837b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="701" y="372" text-anchor="middle" fill="#85837b" font-size="11">VPC</text>

  <!-- Secret Manager -->
  <rect x="740" y="85" width="190" height="90" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="835" y="115" text-anchor="middle" fill="#ecebe6" font-size="15" font-weight="700">Secret Manager</text>
  <text x="835" y="137" text-anchor="middle" fill="#b4b2aa" font-size="12">JWT key (64 chars)</text>
  <text x="835" y="156" text-anchor="middle" fill="#b4b2aa" font-size="12">DB password</text>
  <line x1="738" y1="130" x2="667" y2="130" stroke="#85837b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702" y="120" text-anchor="middle" fill="#85837b" font-size="11">env</text>

  <!-- CI -->
  <rect x="740" y="205" width="190" height="100" rx="10" fill="#1a1a19" stroke="#34342f"/>
  <text x="835" y="233" text-anchor="middle" fill="#ecebe6" font-size="15" font-weight="700">GitHub Actions</text>
  <text x="835" y="255" text-anchor="middle" fill="#b4b2aa" font-size="12">48 tests on real Postgres</text>
  <text x="835" y="274" text-anchor="middle" fill="#b4b2aa" font-size="12">CodeQL · Trivy image</text>
  <text x="835" y="293" text-anchor="middle" fill="#b4b2aa" font-size="12">Trivy Terraform scan</text>

  <text x="30" y="455" fill="#85837b" font-size="11">Made by Talha Aker</text>
</svg>
