spring:
  application:
    name: fightcamp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fightcamp}
    username: ${DB_USER:fightcamp}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

fightcamp:
  jwt:
    # Must be at least 32 bytes. The app refuses to start without it.
    secret: ${JWT_SECRET:}
    ttl: 30m
  login:
    max-failures: 5
    window: 15m
